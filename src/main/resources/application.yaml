spring:
  application:
    name: smart-energy-relational-warehouse
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Adopts databases created before Flyway was introduced (by the old schema.sql):
    # they get baselined at version 1, so V1 is skipped and only newer migrations run.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only checks entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
