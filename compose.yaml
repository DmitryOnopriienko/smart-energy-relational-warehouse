services:
  postgres:
    # Pinned major version: the data directory layout is version-specific (/var/lib/postgresql/<major>/docker),
    # so bumping it requires migrating the data (pg_upgrade or dump/restore).
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Started only with `docker compose --profile app up`, so Spring Boot's Docker Compose support
    # (which starts this file when running the app from the IDE) brings up just the database.
    profiles: ['app']
    build: .
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
